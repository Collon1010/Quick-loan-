<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approved – Quick Loan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }
        .card-approved {
            background: rgba(255,255,255,0.96);
            border-radius: 30px;
            padding: 45px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-approved::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(40,167,69,0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        .icon-big {
            font-size: 70px;
            color: #28a745;
            background: rgba(40,167,69,0.15);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -60px auto 20px;
            position: relative;
            z-index: 1;
        }
        h2 {
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .approved-message {
            font-size: 18px;
            color: #28a745;
            font-weight: 600;
            background: rgba(40,167,69,0.1);
            padding: 12px 20px;
            border-radius: 12px;
            border-left: 4px solid #28a745;
            margin: 15px 0;
        }
        .fee-alert {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 18px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 20px;
            margin: 20px 0;
            box-shadow: 0 6px 20px rgba(245,87,108,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .fee-alert i {
            font-size: 28px;
        }
        .fee-alert .highlight {
            font-weight: 700;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .btn-pay {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 45px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }
        .btn-pay:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(102,126,234,0.6);
            color: white;
        }
        .btn-pay i {
            margin-right: 10px;
        }
        .small-text {
            margin-top: 18px;
            color: #6c757d;
            font-size: 13px;
        }
        .small-text i {
            color: #28a745;
        }
        .payment-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            font-size: 14px;
        }
        .payment-info i {
            color: #667eea;
            width: 20px;
        }
    </style>
</head>
<body>
<div class="card-approved">
    <div class="icon-big">
        <i class="fas fa-check-circle"></i>
    </div>

    <h2>🎉 Loan Approved!</h2>

    <div class="approved-message">
        <i class="fas fa-thumbs-up me-2"></i> Your loan was approved! 
    </div>

    <div class="fee-alert">
        <i class="fas fa-money-bill-wave"></i>
        Please pay <span class="highlight">50 KSH</span> to withdraw your money
    </div>

    <div class="payment-info">
        <p class="mb-1"><i class="fas fa-credit-card"></i> <strong>How to pay:</strong></p>
        <p class="mb-0 text-muted" style="font-size: 13px;">
            You will be redirected to our secure payment page where you can pay using:
            <br>📱 M-PESA • 💳 Card • 🏦 Bank Transfer
        </p>
    </div>

    <a href="#" class="btn-pay" id="payButton">
        <i class="fas fa-credit-card"></i> Pay 50 KSH Now
    </a>

    <p class="small-text">
        <i class="fas fa-lock me-1"></i> Secure payment via Pave Way Express
    </p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const phone = params.get('phone');
    const payBtn = document.getElementById('payButton');

    // Direct link to the payment page
    const paymentPage = "https://paywavexpress.co.ke/pay/quick-loan";

    if (email) {
        // Open the payment page in a new tab
        payBtn.href = paymentPage;
        payBtn.target = "_blank";
    } else {
        payBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const manualEmail = prompt('Please enter your email address:');
            if (manualEmail && manualEmail.includes('@')) {
                window.open(paymentPage, '_blank');
            } else {
                alert('A valid email is required.');
            }
        });
    }
</script>
</body>
</html>
